- name: Supported OS only
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
    fail_msg: "bibVPN supports Debian 12+/Ubuntu 22.04+ servers"

# The apt module needs python3-apt to preview changes under --check. A real run
# installs it automatically; a dry run must not change the server, so it only warns.
- name: Is python3-apt installed
  ansible.builtin.command: dpkg-query -W -f=${Status} python3-apt
  register: common_python3_apt
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remember whether package changes can be previewed
  ansible.builtin.set_fact:
    common_apt_ready: "{{ not ansible_check_mode or 'install ok installed' in common_python3_apt.stdout }}"

- name: Warn that package changes are not previewed
  ansible.builtin.debug:
    msg: "python3-apt is missing, so --check cannot preview package installs; a real deploy installs it"
  when: not common_apt_ready

- name: Install base packages
  when: common_apt_ready
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Network tuning (BBR congestion control, bigger buffers)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-bibvpn.conf
    content: |
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr
      net.ipv4.tcp_fastopen = 3
      net.ipv4.tcp_mtu_probing = 1
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
      net.ipv4.tcp_rmem = 4096 87380 16777216
      net.ipv4.tcp_wmem = 4096 65536 16777216
      fs.file-max = 1048576
    mode: "0644"
  notify: Apply sysctl

- name: Firewall - current state
  ansible.builtin.command: ufw status verbose
  register: common_ufw_status
  changed_when: false
  # Read-only, so it also runs under --check. On a fresh server ufw is not
  # installed yet during --check.
  check_mode: false
  failed_when: false

# SSH is allowed before the firewall is enabled, so we never cut ourselves off. No `ufw limit`:
# it rejects Ansible's burst of connections; brute force is handled by fail2ban.
- name: Firewall - allow SSH and public ports
  ansible.builtin.command: "ufw {{ item }}"
  loop: "{{ [common_ssh_rule] + common_public_rules }}"
  vars:
    common_ssh_rule: "allow {{ ansible_port | default(22) }}/tcp"
    common_public_rules: "{{ bibvpn_public_ports | map('string') | map('regex_replace', '^(.*)$', 'allow \\1/tcp') | list }}"
  register: common_ufw_rule
  changed_when: "'Skipping' not in common_ufw_rule.stdout"

- name: Firewall - close ports of disabled services
  ansible.builtin.command: "ufw delete allow {{ item }}/tcp"
  loop: "{{ bibvpn_closed_ports | default([]) }}"
  register: common_ufw_closed
  changed_when: "'non-existent' not in common_ufw_closed.stdout"

- name: Firewall - deny everything else inbound
  ansible.builtin.command: ufw default deny incoming
  when: "'deny (incoming)' not in (common_ufw_status.stdout | default(''))"
  changed_when: true

- name: Firewall - enable
  ansible.builtin.command: ufw --force enable
  when: "'Status: active' not in (common_ufw_status.stdout | default(''))"
  changed_when: true

- name: SSH - find authorized keys of the deploy user
  ansible.builtin.stat:
    path: "{{ '/root' if ansible_user == 'root' else '/home/' + ansible_user }}/.ssh/authorized_keys"
  register: common_authorized_keys
  when: common_ssh_disable_passwords

- name: SSH - refuse to disable passwords without an authorized key (would lock you out)
  ansible.builtin.assert:
    that:
      - common_authorized_keys.stat.exists
      - common_authorized_keys.stat.size > 0
    fail_msg: >-
      No SSH key in authorized_keys for {{ ansible_user }}. Run `ssh-copy-id` first,
      or set common_ssh_disable_passwords=false.
  when: common_ssh_disable_passwords

# sshd uses the FIRST value it reads for each option, and drop-ins are read in name
# order. Cloud images often ship 50-cloud-init.conf with "PasswordAuthentication yes",
# so our file must sort first ("00-") or it is silently ignored.
- name: SSH - key-only login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-bibvpn.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    mode: "0644"
  when: common_ssh_disable_passwords
  notify: Reload sshd

- name: SSH - remove drop-in from older bibvpn versions
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/90-bibvpn.conf
    state: absent
  notify: Reload sshd

- name: SSH - apply now
  ansible.builtin.meta: flush_handlers

# Trust the effective config, not the file we wrote.
- name: SSH - read effective settings
  ansible.builtin.command: /usr/sbin/sshd -T
  register: common_sshd_effective
  changed_when: false
  # Under --check the new drop-in was not written, so there is nothing to verify.
  when: common_ssh_disable_passwords and not ansible_check_mode

- name: SSH - verify password login is really off
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in common_sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in common_sshd_effective.stdout_lines"
      - "common_sshd_effective.stdout_lines | select('match', '^permitrootlogin (without-password|prohibit-password|no)$') | list | length == 1"
    fail_msg: "sshd still allows password login; check /etc/ssh/sshd_config and sshd_config.d/"
  when: common_ssh_disable_passwords and not ansible_check_mode

- name: Fail2ban running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: not ansible_check_mode
