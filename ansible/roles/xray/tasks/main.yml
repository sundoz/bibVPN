- name: Xray binary (downloaded, not yet switched in)
  ansible.builtin.include_role:
    name: xray_bin
    public: true

- name: Config directory
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    owner: root
    group: xray
    mode: "0750"

# The new config is validated by the binary being switched to, before either goes live.
- name: Validate config against this release
  ansible.builtin.command:
    cmd: "{{ xray_release_dir }}/xray run -test -config stdin:"
    stdin: "{{ lookup('ansible.builtin.file', xray_config_src) }}"
  environment:
    XRAY_LOCATION_ASSET: "{{ xray_release_dir }}"
  changed_when: false

- name: Switch to this release
  ansible.builtin.include_role:
    name: xray_bin
    tasks_from: switch

- name: Restart when a new release was switched in
  ansible.builtin.debug:
    msg: "Xray {{ xray_version }} is now current"
  changed_when: xray_bin_switch.changed
  notify: Restart xray

- name: Install config
  ansible.builtin.copy:
    src: "{{ xray_config_src }}"
    dest: "{{ xray_config_dir }}/config.json"
    owner: root
    group: xray
    mode: "0640"
  notify: Restart xray

- name: Install systemd unit
  ansible.builtin.template:
    src: xray.service.j2
    dest: /etc/systemd/system/xray.service
    mode: "0644"
  notify: Restart xray

- name: Enable Xray
  ansible.builtin.systemd:
    name: xray
    enabled: true
    daemon_reload: true

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Xray is running
  ansible.builtin.systemd:
    name: xray
    state: started

- name: Xray answers on its public ports
  ansible.builtin.wait_for:
    port: "{{ item }}"
    timeout: 20
  loop: "{{ bibvpn_public_ports }}"
